<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Sales Chatbot</title>
<style>
  /*
    Same color convention as the terminal UI (app/ui/console.py), applied to the Web
    frontend for consistency: cyan for the user's own input, green for the bot's actual
    reply, dim yellow for background MCP tool-call activity, red for errors, blue for
    system/connection info. Colors are picked for visual hierarchy and standard
    color-psychology conventions, not decoration.
  */
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e6e6;
    --dim: #8a8f98;
    --cyan: #4fd1e8;
    --green: #57c979;
    --yellow: #c9a54f;
    --red: #e8615a;
    --blue: #5b9dd9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .title { font-weight: 600; }
  header .meta { color: var(--blue); font-size: 0.85em; margin-top: 2px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); }
  .bubble.bot { background: var(--panel); border: 1px solid var(--green); color: var(--text); }
  .bubble.bot .label { color: var(--green); font-weight: 600; font-size: 0.8em; display: block; margin-bottom: 4px; }
  .bubble.user .label { color: var(--cyan); font-weight: 600; font-size: 0.8em; display: block; margin-bottom: 4px; text-align: right; }
  .activity {
    align-self: flex-start;
    color: var(--yellow);
    font-size: 0.85em;
    font-family: ui-monospace, Consolas, monospace;
    opacity: 0.9;
  }
  .error {
    align-self: flex-start;
    color: var(--red);
    font-weight: 600;
    font-size: 0.9em;
  }
  .thinking { color: var(--cyan); font-size: 0.85em; font-style: italic; }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #message {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 1em;
  }
  #message:focus { outline: 1px solid var(--cyan); }
  button {
    background: var(--cyan);
    color: #08202b;
    border: none;
    border-radius: 6px;
    padding: 0 18px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="title">MCP Sales Chatbot</div>
  <div class="meta" id="connection-info">connecting...</div>
</header>
<div id="log"></div>
<form id="composer">
  <input id="message" type="text" placeholder="Ask about products, orders, or ask it to save/commit a file..." autocomplete="off">
  <button type="submit" id="send">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("composer");
  const input = document.getElementById("message");
  const sendButton = document.getElementById("send");
  const connectionInfo = document.getElementById("connection-info");

  function scrollToBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot");
    const bubble = document.createElement("div");
    bubble.className = "bubble " + (role === "user" ? "user" : "bot");
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Bot";
    bubble.appendChild(label);
    bubble.appendChild(document.createTextNode(text));
    row.appendChild(bubble);
    log.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addActivity(text) {
    const div = document.createElement("div");
    div.className = "activity";
    div.textContent = text;
    log.appendChild(div);
    scrollToBottom();
  }

  function addError(text) {
    const div = document.createElement("div");
    div.className = "error";
    div.textContent = "[error] " + text;
    log.appendChild(div);
    scrollToBottom();
  }

  function renderEvents(events) {
    for (const event of events) {
      if (event.type === "tool_call") {
        const args = Object.entries(event.arguments || {})
          .map(([k, v]) => `${k}=${JSON.stringify(v)}`)
          .join(", ");
        addActivity(`  -> calling tool ${event.name}(${args})`);
      } else if (event.type === "tool_result") {
        const text = event.text.length > 200 ? event.text.slice(0, 200) + "..." : event.text;
        addActivity(`  <- result: ${text}`);
      } else if (event.type === "prompt") {
        addActivity(`[prompt:${event.name}] ${event.text}`);
      } else if (event.type === "error") {
        addError(event.text);
      }
    }
  }

  async function loadServerInfo() {
    try {
      const response = await fetch("/api/servers");
      const data = await response.json();
      connectionInfo.textContent = `Model: ${data.model || "?"} | MCP servers: ${(data.servers || []).join(", ") || "none"}`;
    } catch (err) {
      connectionInfo.textContent = "Could not reach the backend.";
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble("user", text);
    input.value = "";
    input.disabled = true;
    sendButton.disabled = true;

    const thinking = document.createElement("div");
    thinking.className = "thinking";
    thinking.textContent = "Thinking...";
    log.appendChild(thinking);
    scrollToBottom();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await response.json();
      thinking.remove();
      renderEvents(data.events || []);
      if (data.reply) {
        addBubble("bot", data.reply);
      }
    } catch (err) {
      thinking.remove();
      addError("Could not reach the chatbot backend: " + err);
    } finally {
      input.disabled = false;
      sendButton.disabled = false;
      input.focus();
    }
  });

  loadServerInfo();
  input.focus();
</script>
</body>
</html>
